<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b1a"/>
      <stop offset="1" stop-color="#1a0b2e"/>
    </linearGradient>
    <linearGradient id="fire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6d5a">
        <animate attributeName="stop-color" values="#ff6d5a;#ff4fa3;#8b5cf6;#ff6d5a" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.5" stop-color="#ff4fa3">
        <animate attributeName="stop-color" values="#ff4fa3;#8b5cf6;#ff6d5a;#ff4fa3" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#8b5cf6">
        <animate attributeName="stop-color" values="#8b5cf6;#ff6d5a;#ff4fa3;#8b5cf6" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
 
  <rect width="1000" height="280" rx="24" fill="url(#bg)"/>
  <rect x="2" y="2" width="996" height="276" rx="22" fill="none" stroke="url(#fire)" stroke-width="3"/>
 
  <!-- floating dots -->
  <g fill="#ff6d5a" opacity="0.5">
    <circle cx="90" cy="60" r="4"><animate attributeName="cy" values="60;40;60" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="910" cy="220" r="5"><animate attributeName="cy" values="220;195;220" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="840" cy="50" r="3"><animate attributeName="cy" values="50;70;50" dur="3.5s" repeatCount="indefinite"/></circle>
  </g>
  <g fill="#8b5cf6" opacity="0.6">
    <circle cx="140" cy="225" r="5"><animate attributeName="cy" values="225;205;225" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="60" cy="150" r="3"><animate attributeName="cy" values="150;170;150" dur="3s" repeatCount="indefinite"/></circle>
  </g>
 
  <text x="500" y="135" text-anchor="middle" font-family="'Courier New', monospace" font-size="104" font-weight="900" fill="url(#fire)" filter="url(#glow)">N8N CLI</text>
  <text x="500" y="190" text-anchor="middle" font-family="'Courier New', monospace" font-size="24" fill="#c9c9e8">run workflows in the background</text>
  <text x="500" y="228" text-anchor="middle" font-family="'Courier New', monospace" font-size="18" fill="#7c7ca8">no server  ·  no localhost  ·  just the CLI</text>
</svg>